# SPDX-License-Identifier: Apache-2.0
#
# Release build. Deliberately separate from ci.yml: the `check` job's green signal is
# load bearing and this workflow does not touch it.
#
# It exists because ci.yml builds the wheel and sdist and then discards them, and keeps no
# evidence of the container images it builds (the browser suite's Compose project and the
# arm64 job's native builds): before those, a blind spot left the API image unbuildable
# from Sprint 6 until 2026-08-20 without any gate noticing. This workflow builds the
# release's own artifacts and images and the evidence describing them.
#
# This workflow publishes nothing. It produces artifacts and the evidence describing
# them; the decision to publish anywhere is a separate, human one.
name: release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this release build is being run
        required: false
        default: manual rehearsal
  push:
    tags:
      - "v*"

# No write scope: this workflow does not create releases, push images, or publish
# packages. Widening this is a deliberate decision, not a convenience.
permissions:
  contents: read

# Every action is pinned by commit SHA, with the release it names in a comment, as in
# ci.yml; `make toolchain-check` refuses an unpinned one.

jobs:
  # The browser suite, as in ci.yml (RR-021), so that the release refuses on its own:
  # neither the artifacts nor the image evidence are built from a tree it fails. Nothing
  # is uploaded from it: a failed page's trace or screenshot can show a brief or a
  # model-key field, so the report stays on the runner.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium build that the lockfile's Playwright pins, with its system libraries.
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run the browser suite on a Compose project of its own
        run: python3 scripts/run_browser_suite.py --project "oak-e2e-${{ github.run_id }}-${{ github.run_attempt }}" --commit "${{ github.sha }}"

  artifacts:
    name: build and verify release artifacts
    runs-on: ubuntu-latest
    needs: web-e2e
    # The gate below is the gate CI runs, the suites that skip silently included: the
    # PostgreSQL-gated suites need OAK_TEST_DATABASE_URL and a migrated database, and the
    # real-daemon runner journeys need their stand-in image cached. A release is the last
    # place to find out that either skipped. The service runs the image compose.yaml pins.
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: oak
          POSTGRES_USER: oak
          POSTGRES_PASSWORD: oak-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oak -d oak"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OAK_TEST_DATABASE_URL: postgresql+psycopg://oak:oak-local-only@127.0.0.1:5432/oak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.8"
          enable-cache: true

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Bootstrap from the committed lockfiles
        run: make bootstrap

      # The gate's skips are counted against CI's x86_64 row; this proves where it ran.
      - name: Assert the venv is linux-x86_64
        run: uv run python -c "import sysconfig, sys; platform = sysconfig.get_platform(); print(platform); sys.exit(platform != 'linux-x86_64')"

      # The runner journeys never pull their image themselves (tests need no network).
      - name: Fetch the runner journeys' stand-in image
        run: docker pull docker.io/rancher/mirrored-pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a

      # An unmigrated database fails the gated suites as if the code had regressed.
      - name: Migrate the test database
        run: uv run oak-db-migrate
        env:
          OAK_DATABASE_URL: ${{ env.OAK_TEST_DATABASE_URL }}

      - name: Refuse to release from a tree that fails the gate
        run: make check
        env:
          OAK_SKIP_LEDGER: ${{ runner.temp }}/skips.jsonl

      # The gate's skips are CI's check job's, by reason and count (RR-014).
      - name: Refuse a gate that skipped more than CI's
        run: python3 scripts/check_skips.py "${{ runner.temp }}/skips.jsonl" check-linux-x86_64

      - name: Build release artifacts, SBOM, licence inventory and checksums
        run: make release

      # The checksums only: the maintainer signs SHA256SUMS offline after this build, so a
      # signature cannot exist yet. Consumers run the verifier without the flag, which
      # requires one for every release after 0.9.0 (RR-005, docs/release-process.md).
      - name: Verify the artifacts against their checksums, before signing
        run: uv run python scripts/verify_release.py --checksums-only dist/release

      - name: Show what a consumer will verify
        run: cat dist/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/release/
          retention-days: 90
          if-no-files-found: error

  images:
    name: build container images
    runs-on: ubuntu-latest
    needs: web-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned by version and digest: timestamp rewriting needs 0.13 or later,
          # and the reproducibility evidence records the builder (RR-006).
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Read the release version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The release's own images, built and scanned for its evidence. CI builds them too
      # (web-e2e and check-linux-arm64), but a force-included directory missing from the
      # build context has broken them before, and this is the build the evidence names.
      # Each is built twice, the second time with no cached layer, and the two image IDs
      # must match: that is the reproducibility claim, for linux/amd64 (RR-006).
      - name: Build both images twice for linux/amd64 and compare
        run: |
          mkdir -p image-evidence
          python3 scripts/reproduce_images.py \
            --platform linux/amd64 \
            --output image-evidence/image-reproducibility.json \
            deploy/images/api.Dockerfile deploy/images/web.Dockerfile
          cat image-evidence/image-reproducibility.json

      - name: Prove the API image runs the packaged entrypoint
        run: |
          reported="$(docker run --rm oak-community/api:${{ steps.version.outputs.value }} oak --version)"
          expected="$(cat VERSION)"
          test "$reported" = "$expected" || {
            echo "image reports $reported, expected $expected" >&2
            exit 1
          }

      # The IDs of the images the evidence names; the reproducibility record above holds
      # the second build's IDs beside them.
      - name: Record image digests
        run: |
          mkdir -p image-evidence
          for image in api web; do
            docker image inspect "oak-community/$image:${{ steps.version.outputs.value }}" \
              --format '{{.Id}}' >> image-evidence/image-digests.txt
          done
          cat image-evidence/image-digests.txt

      # Scan gate plus the image release evidence the security invariants require
      # (RR-038): per-image CycloneDX SBOMs and unsigned provenance, generated by the
      # pinned socketless scanner from exported tarballs. The script is stdlib-only, so
      # no Python setup step is needed. A fixable CRITICAL/HIGH fails this job.
      - name: Scan the images and emit SBOMs and provenance
        run: |
          python3 scripts/scan_images.py \
            --platform linux/amd64 \
            --reproducibility image-evidence/image-reproducibility.json \
            --output image-evidence/container-scan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: image-evidence/
          retention-days: 90
          if-no-files-found: error
