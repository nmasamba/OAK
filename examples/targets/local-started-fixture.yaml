target_profile_version: 0.2.0
id: target.local-started-fixture
status: non-production-local
environment: validation
tenant_id: local
platform:
  operating_system: linux
  architecture: x86_64
  accelerators: []
  drivers: []
  container_runtime: rootless-compatible OCI runtime
capacity:
  ram_gib: 32
  storage_gib: 100
network:
  mode: isolated-no-egress
  inbound_control_plane: false
permissions:
  mutation_allowed: true
  allowed_operations: [inventory, validate, render, plan, verify, apply, rollback, destroy]
execution:
  mutation_acknowledgement: isolated-non-production-hardened-start
  component_images:
    - manifest_id: component.fixture-lexical-search
      image_reference: rancher/mirrored-pause
      image_digest: sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    - manifest_id: component.fixture-local-model
      image_reference: rancher/mirrored-pause
      image_digest: sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    - manifest_id: component.fixture-high-assurance-model
      image_reference: rancher/mirrored-pause
      image_digest: sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
  allowed_registries: [docker.io]
secrets:
  allowed_references: []
notes:
  - Synthetic non-production target. Its only permitted mutation creates one labelled,
    network-isolated container per node of the selected candidate, starts each under the
    runner's fixed hardening (no network, read-only root, no capabilities, no new
    privileges, uid 65534, memory, CPU and process ceilings, no volumes, no environment),
    smoke-tests it, and removes them again on rollback or destroy.
  - Every catalogue component is a synthetic fixture, so each maps to the same stand-in
    image, docker.io/rancher/mirrored-pause:3.10 pinned by its index digest. It runs until
    stopped and needs no network; it proves the install, test and removal loop and
    implements none of the components.
