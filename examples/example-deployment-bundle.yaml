    - Start the digest-pinned fixture service.
  verify:
    - Run health, no-egress, search and evaluation smoke tests.
  backup:
    - Preserve the content-digested source corpus; the index is derived.
  restore:
    - Recreate the index from the source corpus.
  rollback:
    - Stop the candidate and restore the prior digest or empty target state.
  upgrade:
    - Compile a new bundle and rebuild the derived index.
  downgrade:
    - Restore the earlier compatible bundle digest.
  uninstall:
    - Stop the fixture service and delete its isolated network and derived index.
  decommission:
    - Verify derived deletion and retain only approved test evidence.
