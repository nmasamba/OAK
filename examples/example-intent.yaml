schema_version: 0.3.0
id: intent.public-manual-qa
version: 0.1.0
status: draft
created_at: 2026-08-13T12:00:00Z
supersedes: null
spec:
  purpose:
    problem: Reviewers need a low-risk fixture that exercises ingestion, retrieval, inference, evidence and rollback.
    desired_outcomes:
      - Return answers that cite the relevant passage in a public technical manual.
    exclusions:
      - No consequential action or production customer data.
    baseline: Keyword and lexical search with source excerpts.
    ai_needed_hypothesis: Retrieval plus generation may improve synthesis only if citation correctness remains above the gate.
  stakeholders:
    end_users:
      - Architecture reviewers
    operators:
      - Prototype engineer
    affected_non_users: []
    accountable_owner: null
    domain_experts: []
    reviewers:
      - Security reviewer
  decision:
    task_types:
      - retrieval
      - generation
    actions:
      - Display a cited answer or abstain.
    autonomy: assistive
    reversibility: reversible
    irreversible_actions: []
  domain:
    sectors:
      - software engineering
    setting: Non-production local evaluation
    countries: []
    languages:
      - en
    accessibility_requirements:
      - Keyboard-operable review interface
    cultural_considerations: []
  regulatory_nexus:
    nexus_ref: nexus.public-manual-qa
    eu_nexus: possible
    operator_roles: []
  risk_utility:
    decision_cost_model_ref: cost.public-manual-qa
    risk_tier: low
    high_materiality_unknowns:
      - Real provider, deployer, market and affected-person locations are not supplied.
  data:
    sources:
      - Public technical manuals selected for the fixture
    classifications:
      - public
    volume: Small fixture corpus
    lineage_requirement: Source URL, version, retrieval time and content digest
    retention: Fixture corpus retained for reproducible evaluation
    residency: []
    permitted_uses:
      - Architecture compiler evaluation
    deletion_requirement: Delete local fixture index during uninstall test.
  quality_contract:
    evaluation_contract_ref: eval.public-manual-qa
    task_metrics:
      - citation_correctness
      - answer_supported_rate
      - abstention_quality
    subgroup_metrics: []
    thresholds:
      citation_correctness: 0.98
    unacceptable_behaviors:
      - Claiming an answer is supported when no cited passage entails it.
  operational_contract:
    expected_users: 10
    concurrency: 2
    modes:
      - interactive
    latency_p95_ms: 5000
  hardware:
    cpu_architectures:
      - x86_64
    accelerators: []
    ram_gib: 32
    storage_gib: 100
    drivers: []
  deployment_environment:
    modes:
      - local
    targets:
      - OCI-compatible single-node container runtime
    network_constraints:
      - No runtime egress after corpus and artifacts are staged.
  security_tenancy:
    tenant_model: single_tenant
    trust_boundaries:
      - Untrusted document content to parser and retriever
      - Generated text to cited-answer validator
    privileged_actions: []
    egress_policy: Default deny during evaluation.
    audit_requirement: Record corpus, model, prompt, evaluation and bundle digests.
    threat_actors:
      - Malicious content author
  openness_sovereignty:
    allowed_software_classes:
      - osi_open_source_software
    allowed_model_classes:
      - osi_open_source_ai
      - open_weight_restricted_with_exception
    proprietary_exception_process: Explicit owner approval with an exit path.
    data_locality:
      - local
    model_locality:
      - local
    portability_requirement: Export all canonical objects and indexes.
  economics:
    staffing: One prototype engineer and part-time reviewers.
    procurement_constraints: []
  organization:
    skills:
      - Python
      - container operations
    team_size: 2
    owners:
      architecture: null
      security: null
    support_hours: Prototype only; no production support.
    change_process: Pull request and recorded approval for fixture changes.
  lifecycle:
    expected_lifetime_months: 3
    adaptation_policy: No online learning.
    upgrade_policy: Recompile and rerun the full fixture suite.
    decommission_policy: Uninstall, delete derived index and retain test evidence.
