# SPDX-License-Identifier: Apache-2.0
schema_version: 0.4.0
id: pattern.high-assurance
version: 0.1.0
variant: high_assurance_sovereign
description: Accelerator-backed generated answer with independent verification evidence.
roles:
  - id: role.retrieval
    role: Deterministic cited passage retrieval
    component_category: software
    required_capability: lexical_retrieval
    data_classifications: [public]
  - id: role.generation
    role: High-assurance answer generation and verification
    component_category: model
    required_capability: independent_verification
    data_classifications: [public]
edges:
  - from: role.retrieval
    to: role.generation
    interface: Local HTTP
    data: Cited public passages
    security: Isolated target network with no runtime egress
component_requirements:
  - role_id: role.retrieval
    manifest_id: component.fixture-lexical-search
    purpose: Retrieve supporting passages
    required: true
  - role_id: role.generation
    manifest_id: component.fixture-high-assurance-model
    purpose: Generate and independently verify the answer
    required: true
hard_requirements: [local, no_runtime_egress, public_data, x86_64, fixture_gpu, human_review]
extensions: {}
