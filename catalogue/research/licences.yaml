# SPDX-License-Identifier: Apache-2.0
# DRAFT for the owner's review in the Sprint 14 pull request (ADR-0018).
#
# The closed list of licence ids research may send to GitHub as a `license:` keyword and
# may recognise on the Hub and in GitHub's detected licence. It is seeded from
# `PERMISSIVE_LICENCES` in `src/oak/adapters/models/huggingface_catalogue.py`. Each entry
# maps one SPDX id to a licence classification for the research gates, with where that
# was read and when. It never sets `availability_class`, which stays a human decision under
# ADR-0011. An id that is not here, `other` and `NOASSERTION` fail the licence gate with
# a stable reason code; a listed id whose classification is restricted, source_available,
# proprietary or unknown fails it too, recorded either way.
schema_version: 0.1.0
id: research.licences
version: 0.1.0
as_of: "2026-10-21"
licences:
  - spdx_id: Apache-2.0
    classification: osi_approved
    github_keyword: apache-2.0
    hub_tag: apache-2.0
    source: https://spdx.org/licenses/Apache-2.0.html
    checked_at: "2026-10-21"
  - spdx_id: MIT
    classification: osi_approved
    github_keyword: mit
    hub_tag: mit
    source: https://spdx.org/licenses/MIT.html
    checked_at: "2026-10-21"
  - spdx_id: BSD-3-Clause
    classification: osi_approved
    github_keyword: bsd-3-clause
    hub_tag: bsd-3-clause
    source: https://spdx.org/licenses/BSD-3-Clause.html
    checked_at: "2026-10-21"
