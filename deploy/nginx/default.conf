server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /version {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Matches the API's documented request cap; the API enforces the exact limit.
        client_max_body_size 96m;
    }

    location / {
        # The workspace must never be framed: the settings screen holds a credential field.
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
