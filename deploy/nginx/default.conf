server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /version {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
