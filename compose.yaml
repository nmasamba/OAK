name: oak-community

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: oak
      POSTGRES_USER: oak
      POSTGRES_PASSWORD: oak-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oak -d oak"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - oak-postgres-data:/var/lib/postgresql/data
    networks:
      - control-plane

  api:
    build:
      context: .
      dockerfile: deploy/images/api.Dockerfile
    environment:
      OAK_HOST: 0.0.0.0
      OAK_PORT: "8080"
      OAK_ALLOW_NON_LOOPBACK: "true"
      OAK_DATABASE_URL: postgresql+psycopg://oak:oak-local-only@postgres:5432/oak
      OAK_ARTIFACT_ROOT: /var/lib/oak/artifacts
      OAK_ENVIRONMENT_ID: local
      OAK_LOCAL_ACTOR: local-user
      OAK_LOCAL_TENANT: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - control-plane
    volumes:
      - oak-artifacts:/var/lib/oak/artifacts

  migrate:
    build:
      context: .
      dockerfile: deploy/images/api.Dockerfile
    command: ["oak-db-migrate"]
    environment:
      OAK_DATABASE_URL: postgresql+psycopg://oak:oak-local-only@postgres:5432/oak
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane

  worker:
    build:
      context: .
      dockerfile: deploy/images/api.Dockerfile
    command: ["oak-worker"]
    environment:
      OAK_DATABASE_URL: postgresql+psycopg://oak:oak-local-only@postgres:5432/oak
      OAK_ARTIFACT_ROOT: /var/lib/oak/artifacts
      OAK_ENVIRONMENT_ID: local
      OAK_LOCAL_TENANT: local
      OAK_WORKER_ID: oak-worker-compose
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - control-plane
    volumes:
      - oak-artifacts:/var/lib/oak/artifacts

  web:
    build:
      context: .
      dockerfile: deploy/images/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - control-plane

networks:
  control-plane: {}

volumes:
  oak-artifacts:
  oak-postgres-data:
